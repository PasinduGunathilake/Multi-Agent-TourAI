# ==============================================================================
# Multi-Agent-TourAI: Nginx Reverse Proxy Configuration
# Bridges Next.js Frontend (Port 3000) and FastAPI Backend (Port 8000)
# Supports: Zero-Buffer SSE Streaming, Long Multi-Agent Timeouts, and Next.js HMR
# ==============================================================================

events {
    # Maximum simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # Include standard MIME types for correct browser content handling
    include       mime.types;
    default_type  application/octet-stream;

    # High-performance static file transfer optimization
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression: Reduces bandwidth and accelerates asset loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        # Standard HTTP port (eliminates the need for :3000 or :8000 in browser)
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # 1. FastAPI Documentation & Health Check Endpoints
        # Routes /docs, /openapi.json, and /health directly to FastAPI backend
        # ----------------------------------------------------------------------
        location ~ ^/(docs|openapi.json|health) {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 2. FastAPI Backend & Server-Sent Events (SSE) Real-Time Streaming
        # CRITICAL: Disables proxy buffering so typewriter tokens stream instantly
        # ----------------------------------------------------------------------
        location /api/ {
            # Forward all /api/ requests to FastAPI on port 8000
            proxy_pass http://127.0.0.1:8000;

            # Disable buffering & caching to ensure zero-latency token delivery
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;

            # Extended timeouts for long-running multi-agent fan-out & HITL loops
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;

            # Forward original client headers for observability and audit logging
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 3. Next.js Frontend & Hot Module Replacement (HMR)
        # Routes all web pages, static assets, and WebSocket hot-reloads
        # ----------------------------------------------------------------------
        location / {
            # Forward all UI traffic to Next.js on port 3000
            proxy_pass http://127.0.0.1:3000;

            # Pass standard host and IP information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade headers for Next.js Fast Refresh / Hot Reloading
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}